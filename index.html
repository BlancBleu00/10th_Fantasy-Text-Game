scenes.market_elven_native.text=s=>`${dlg('laen',s=>isSpecies('엘프')?(lang('elven')>=8?'마침 잘 왔네. 저 인간은 내가 길 이름을 말할 때마다 칼자루를 잡아.':'…얼굴은 같은데 억양은 인간 쪽에 가깝군. 그래도 내 말은 알아듣는구나.'):'내 말을 알아듣는 인간은 드문데. 잘됐군. 설명 좀 해줘. 나는 욕한 적 없어.')}

라엔이 찾는 곳은 북문 밖 폐역참으로 이어지는 옛길, ‘타르 벨라’다. 엘프어에서는 오래된 길을 부르는 이름에 가깝지만, 이 지방 인간 방언으로는 혈통을 깎아내리는 욕과 소리가 묘하게 겹친다.

당신에게는 어디서 오해가 생겼는지 보인다. 이제 필요한 건 번역보다 설득이다. 마르크가 자기 귀가 틀릴 수도 있다는 가능성을 받아들여야 한다.`;

scenes.market_gesture.text=s=>hasFlag('몸짓으로 길 추론')?`라엔은 사람을 가리키지 않는다. 계속 북쪽과 수레, 손에 든 청동패를 번갈아 가리킨다. 팔과 어깨에도 싸우려는 힘이 들어가 있지 않다.

말은 알아듣지 못해도 한 가지는 짐작할 수 있다. 그는 누군가를 모욕하는 게 아니라 장소를 설명하려고 한다.

${dlg('mark','…그러니까 네 말은, 저게 사람한테 한 소리가 아니라 길 이름일 수도 있다는 거냐?')}`:`라엔의 손은 계속 북쪽을 향한다. 하지만 그것만으로는 부족하다. 도망가겠다는 건지, 길을 묻는 건지, 누군가를 부르는 건지까지는 읽히지 않는다.

${dlg('mark','네 표정 보니까 너도 모르잖아. 모르면 모른다고 해. 괜히 더 꼬이게 하지 말고.')}

당신은 지금, 모르는 것을 인정할지 아니면 불완전한 짐작으로 한 걸음 더 나아갈지 결정해야 한다.`;

// 사망 문장의 조사도 자연스럽게
scenes.death.text=s=>`몸이 더 이상 명령을 듣지 않는다.

소리는 점점 멀어진다. 마지막 순간 누군가 <b>${playerName()}</b>${hasFinalConsonant(state.name)?'을':'를'} 부른 것 같지만, 누구였는지도 확실하지 않다.

이 세계에는 당신 없이도 장터가 열리고, 누군가는 싸우고, 누군가는 밭을 갈며, 오래된 문 아래에서는 여전히 무언가가 움직일 것이다.

<div class="endingCard"><div class="endingNum">DEATH END</div><h3>여기까지의 삶</h3>모든 삶이 세계의 중심에 닿는 것은 아니다. 그렇다고 중심에 닿지 못한 삶이 존재하지 않았던 것도 아니다.</div>`;

// 처음부터 버튼 하나로 돌아갈 때도 새 캐릭터 생성으로
restartConfirm=function(){if(confirm('현재 진행을 버리고 새로운 삶을 시작하시겠습니까?')){state=freshState();creationDraft={species:null,gender:null};pendingCombat=null;render()}};


/* 0.8b — 한국어 교정과 짧은 장면 재작성 */
function attachRo(text){const a=Array.from(String(text||''));if(!a.length)return text+'로';const ch=a[a.length-1],c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const jong=(c-0xAC00)%28;return text+(jong!==0&&jong!==8?'으로':'로')}return text+'로'}
scenes.choose_species.choices=()=>SPECIES_ORDER.map(sp=>choice(`${attachRo(sp)} 태어난다.`,'choose_gender',{do:()=>{creationDraft={species:sp,gender:null}},review:`이번 삶은 <b>${attachRo(sp)}</b> 시작합니다. 아직 이름도 직업도 없지만, 몸과 언어의 첫 조건은 정해졌습니다.`,noEncounter:true,hint:SPECIES_FLAVOR[sp]})).concat([choice('종족도 운에 맡긴다.','choose_gender',{do:()=>{creationDraft.species=SPECIES_ORDER[rollInt(0,SPECIES_ORDER.length-1)]},review:s=>`이번 삶의 종족은 <b>${creationDraft.species}</b>으로 정해집니다.`,noEncounter:true})]);

// 소문을 듣는 과정에도 거리, 확산도, 신뢰도가 작용한다.
hearPublicRumors=function(id){if(!state?.rumors?.length)return;state.npcRumorSeen=state.npcRumorSeen||{};state.npcRumorSeen[id]=state.npcRumorSeen[id]||[];const candidates=state.rumors.slice(0,20).filter(r=>!state.npcRumorSeen[id].includes(r.id||`${r.day}:${r.reason}`)).map(r=>({r,score:rumorRelevance(id,r),chance:clamp((r.spread||8)+(r.credibility||70)*.25+Math.abs(rumorRelevance(id,r))*15,5,92)})).filter(x=>Math.abs(x.score)>=.3&&rng()*100<x.chance).sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));if(!candidates.length)return;const {r,score}=candidates[0];const rid=r.id||`${r.day}:${r.reason}`;rememberNPC(id,`소문으로 들었다: ${r.reason}`,r.distortion?'전해 들은 왜곡된 소문':'전해 들은 소문',r.credibility||65,score>0?'호의':'경계');if(score>=1.2)modImpression(id,{respect:1});else if(score<=-1.2)modImpression(id,{trust:-1});state.npcRumorSeen[id].push(rid);state.npcRumorSeen[id]=state.npcRumorSeen[id].slice(-40)};

scenes.enc_dead_bird.text=s=>`배수로 옆에 까마귀 한 마리가 죽어 있다. 사흘 동안 비가 쏟아졌으니 새 한 마리 죽어 있는 것만으로는 이상할 게 없다.

그런데 가까이 지나치는 순간 발목에 가느다란 검은 것이 감긴 게 보인다. 처음에는 젖은 실밥처럼 보이지만, 물살이 건드려도 풀리지 않는다. 피부 아래로 파고든 뿌리인지, 누군가 묶어놓은 끈인지는 아직 알 수 없다.

주변 사람들은 발걸음을 멈추지 않는다. 이상한 것을 발견한 사람이 당신뿐인지, 다들 보고도 모른 척하는 건지조차 분명하지 않다.`;

scenes.guard_nightwatch.text=s=>`성벽 위에서 세 시간이 흐른다.

처음 한 시간은 북쪽 숲에서 간간이 불빛이 보인다. 두 번째 시간에는 그것마저 사라진다. 마르크는 두 번 하품하고도 졸지 않으려고 창자루를 바닥에 두드리고, 아래 초소에서는 교대병들이 작은 목소리로 카드패를 섞는다.

아무 일도 일어나지 않는다.

평소라면 지루했을 시간이다. 오늘은 그 사실이 이상할 만큼 안심이 된다. 북쪽에서 짐승이 사라지고, 환자가 들어오고, 땅 아래에서 소리가 난다는 말을 하루 종일 들은 뒤라서다.

새벽 가까이 되자 마르크가 성벽 난간에서 몸을 떼며 말한다.

${dlg('mark','오늘 밤은 조용하네. 이럴 때 자두는 게 낫다. 진짜 일이 생기면 그때는 잘 시간도 없을 테니까.')}`;

scenes.enc_child_after_ignore.text=s=>`어제 창고 뒤에서 보았던 아이가 오늘은 다른 아이 둘과 함께 있다.

당신이 골목으로 들어서자 가장 작은 아이가 먼저 당신을 알아본다. 뭐라고 귓속말하자 셋의 시선이 잠깐 동시에 올라왔다가 다시 내려간다. 누구도 다가오지 않고, 누구도 손을 내밀지 않는다.

어제 당신이 지나간 일을 원망하는지, 단지 먹을 것을 주지 않는 사람으로 분류했을 뿐인지는 알 수 없다. 다만 아이들에게도 사람을 기억하는 방식이 있고, 당신은 그 기억 하나에 이미 들어가 있다.`;

scenes.tenth_no_name.text=s=>`당신은 입을 다문다. 아무 이름도 주지 않기로 한다.

그런데 침묵은 빈칸이 되지 않는다. 머릿속에서 오래전에 들은 사람들의 이름, 경전의 단어, 라엔이 말한 엘프어, 어린 시절 누군가 불러주던 호칭이 순서 없이 떠오른다. 마치 검은 문 너머의 무언가가 ‘이름’이라는 개념을 당신 기억에서 배우는 것 같다.

순간적으로 소름이 돋는다.

이름을 주지 않았다고 해서 접촉까지 없었던 일이 되지는 않는다. 당신은 오히려 빈자리를 빈자리로 남겨두는 일이 얼마나 적극적인 선택인지 깨닫는다.`;

scenes.forest_capture.text=s=>`헤른의 팔을 뒤로 돌려 결박하려는 순간, 축 늘어져 있던 몸이 갑자기 튄다.

손톱이 당신 팔을 길게 긁고 지나간다. 깊은 상처는 아니지만 금세 붉은 피가 맺힌다. 헤른은 사람처럼 욕하지도, 짐승처럼 으르렁거리지도 않는다. 대신 이 사이로 짧은 숨을 몇 번 밀어낸다.

${dlg('mark','손 조심해. 힘이 빠진 척한 거야. 아니면… 자기도 언제 움직일지 모르는 걸 수도 있고.')}

마르크가 무릎으로 어깨를 눌러 겨우 매듭을 끝낸다. 살아서 데려간다는 선택은 죽이는 것보다 자비로울 수 있다. 그만큼 더 많은 위험도 함께 데려가는 선택이다.`;

scenes.house_bed.text=s=>`침상부터 살핀다. 짚은 눅눅하지만 완전히 썩지는 않았고, 모포 한쪽에는 사람이 반복해서 몸을 돌린 흔적이 남아 있다.

벽 틈과 바닥판까지 손을 넣어보지만 편지나 돈주머니 같은 건 나오지 않는다. 실패라고 부르기에는 애매한 흔적만 남는다. 이 집은 버려진 지 오래되지 않았다. 누군가는 며칠 전까지 여기서 자고, 일어나고, 다시 이불을 덮었다.

당신이 마당으로 나가자 바깥 공기가 오히려 덜 답답하게 느껴진다. 찾던 단서는 없지만, 사람이 사라진 시점만큼은 조금 좁혀졌다.`;

scenes.enc_rain_shrine.text=s=>`무너진 담벼락 아래 손바닥만 한 돌 제단이 있다. 비를 피하려고 처마 밑에 몸을 붙이지 않았다면 지나쳤을 크기다.

신의 문장도, 교단의 색도 남아 있지 않다. 누군가 오래전에 표면을 긁어 지운 흔적만 있다. 빗물이 고인 둥근 홈에서는 주변보다 한 박자 늦게 물결이 번진다.

${hasFlag('제단 아홉 자국')?'<span class="narrationEm">물을 손끝으로 밀어내자 홈이 하나가 아니라 정확히 아홉 개라는 사실이 드러난다. 크기도 깊이도 조금씩 다르다.</span>':'낡은 제단 하나를 이상하게 느끼는 게 과민한 건지, 그냥 지나치는 게 둔한 건지는 아직 판단하기 어렵다.'}`;

scenes.report_lie.text=s=>`당신은 폐역참이 무너져 있었고 눈에 띄는 것은 없었다고 보고한다.

오르반은 곧바로 반박하지 않는다. 팔짱을 낀 채 당신 얼굴을 오래 본다. 질문을 하나 더 던지면 거짓말이 드러날 거라고 생각하는 사람의 침묵인지, 이미 다른 보고와 대조하고 있는 침묵인지 알기 어렵다.

${dlg('orban','그래. 아무것도 없었다는 것도 보고는 보고지.')}

아델은 서류에서 눈을 들었다가 다시 내린다. 믿은 얼굴은 아니다. 하지만 증거 없이 당신을 몰아세우지는 않는다.

그렇게 폐역참에서 본 일은 공식 기록에서 빠진다. 적어도 오늘 오후까지는.`;

scenes.enc_black_dog.text=s=>`검은 개 한 마리가 골목 한가운데 서 있다. 갈비뼈가 드러날 만큼 마른 것도 아니고, 목에 끈 자국도 없어 주인이 있는지조차 알기 어렵다.

사람이 가까이 가도 짖지 않는다. 당신이 한 걸음 다가가자 개는 북쪽을 한 번 보고, 다시 당신 얼굴을 본다. 우연이라고 넘기기에는 같은 행동을 두 번 반복한다.

${hasFlag('검은개 발자국 역행')?'<span class="narrationEm">진흙을 보니 더 이상하다. 발자국은 북쪽에서 온 것이 아니라, 이 골목에서 북쪽으로 갔다가 돌아오기를 여러 번 반복했다.</span>':'길짐승에게 의미를 부여하는 건 쉽다. 특히 도시 전체가 불안할 때는 더 그렇다.'}`;

scenes.archive_night.text=s=>`기록고의 밤은 바깥보다 시간이 느리다. 양초 하나가 절반 가까이 줄어드는 동안 당신은 서로 다른 필체의 문서 수십 장을 넘긴다.

검은 문을 직접 가리키는 문장은 끝내 나오지 않는다. 대신 다른 종류의 이상함이 반복된다. 인간력 이전이라고 분류된 기록의 상당수가 원본이 아니라 후대 필사본이고, 몇몇 문서는 같은 사건을 옮겨 적으면서 숫자와 고유명사만 미묘하게 바꿨다.

${dlg('toma','원본이 없다는 건… 그냥 오래돼서 없어진 걸 수도 있죠? 누가 일부러 없앤 게 아니라.')}

그럴 수도 있다. 아직은 어느 쪽도 증명할 수 없다.

찾던 답은 없지만, 기록 그 자체를 믿어도 되는지라는 더 성가신 질문이 남는다.`;

scenes.escape_help.text=s=>`계단 중간에서 누군가 발을 헛디딘다.

앞사람들은 이미 위쪽 빛을 보고 달리고 있다. 멈추면 천장에서 떨어지는 돌을 더 오래 맞아야 한다. 당신은 두 걸음을 더 올라갔다가 욕을 내뱉고 다시 몸을 돌린다.

뒤처진 사람의 팔을 잡아 일으키는 순간 돌조각 하나가 어깨를 친다. 팔이 저릿해지지만 손을 놓을 정도는 아니다. 곧 다른 사람이 돌아와 반대쪽 팔을 잡는다.

누군가를 구했다고 해서 갑자기 영웅이 되는 건 아니다. 다만 지상에 도착했을 때 인원수를 세는 사람이 한 명을 덜 잃는다. 오늘의 차이는 그 정도로 구체적이다.`;

scenes.enc_old_soldier.text=s=>`성벽 아래 술집 앞에서 한쪽 다리를 저는 노인이 당신 걸음을 오래 바라본다. 술잔은 이미 비었는데 자리를 뜨지는 않는다.

“칼을 배운 사람은 손보다 어깨가 먼저 보여. 사람 죽여본 놈은 발이 다르고.”

그는 당신 장비보다 자세를 본다. 취객이 아는 척하는 것처럼 들리다가도, 시선이 무기 끝과 골반, 발 간격을 차례로 훑는 걸 보면 완전히 허풍만은 아닌 듯하다.

노인은 술 냄새가 나지만 눈은 흐리지 않다. 북쪽 성벽을 바라볼 때만 표정에서 취기가 조금 사라진다.`;

scenes.blackdoor_touch.text=s=>`손바닥이 검은 표면에 닿는 순간 통증이 한꺼번에 터진다.

돌은 차갑다. 그런데 피부는 불에 덴 것처럼 붉어지고 손가락 관절이 제멋대로 굽는다. 빛, 어둠, 불, 물, 대지, 생명, 죽음, 전기, 바람. 이름을 알고 있든 모르든 서로 다른 아홉 감각이 한순간에 몸을 통과한다.

마지막에는 아무것도 없다.

그 ‘아무것도 없음’이 오히려 가장 오래 남는다. 아홉이 지나간 다음 정확히 한 자리만 비어 있는 것 같은 감각. 당신은 본능적으로 손을 떼지만, 이미 기억 속에는 빈칸의 모양이 남아 있다.`;

scenes.report_public.text=s=>`당신은 숨기지 않기로 한다. 폐역참 아래에서 본 문과 검은 뿌리, 움직이던 시체, 오래된 기록까지 가능한 한 정확하게 설명한다.

문제는 정확한 말이 그대로 남지 않는다는 데 있다.

당신이 “지하에 오래된 구조가 있다”고 말한 지 몇 분도 지나지 않아 누군가는 “도시 아래 죽은 자의 나라가 있다”고 전한다. 검은 뿌리는 저주가 되고, 엘프의 옛길은 침공로가 된다. 상점 하나가 문을 닫자 옆 가게도 따라 셔터를 내린다.

아직 남문은 열려 있는데 벌써 짐을 싸는 사람이 보인다.

진실을 공개하는 일과 사람들이 진실을 이해하게 만드는 일은 전혀 다른 문제다.`;

scenes.ending_compute.text=s=>{const e=computeEnding().html;const known=(state.deedLedger||[]).slice(0,3).map(d=>`<div class="item">${d.reason}<div class="dim" style="margin-top:3px">${d.witness} 보거나 전해 들었다.</div></div>`).join('');return `${e}

일주일 전에는 당신 이름을 아는 사람이 몇 명뿐이었을 수도 있다. 지금은 누군가는 직접 겪은 일로, 누군가는 소문으로, 누군가는 잘못 전해진 이야기로 <b>${playerName()}</b>${hasFinalConsonant(state.name)?'을':'를'} 기억한다.

<div class="future"><b>현재 장기 경로</b><br>${futurePaths()||'아직 뚜렷한 장기 경로가 없다.'}</div>
${known?`<div class="divider"></div><b>세상에 남은 최근 흔적</b>${known}`:''}`};

// 초반 오크/고블린 검문 장면은 종족에 따라 말의 결을 조금 다르게 한다.
scenes.prelude_outsider.text=s=>{const extra=isSpecies('그린 오크')?'경비병은 당신 팔과 어깨를 한 번 훑은 뒤에야 얼굴을 본다. 짐꾼인지 용병인지부터 분류하려는 시선에 가깝다.':isSpecies('고블린')?'경비병의 시선은 당신 얼굴보다 가방의 자물쇠와 주머니를 먼저 훑는다. 장터에서 익숙하게 받아온 종류의 의심이다.':'';return `성문 앞 경비병은 당신 차례가 되자 앞사람보다 질문을 하나 더 한다.

“어디서 왔지? 도시에 얼마나 있었고?”

${extra}

익숙한 일이라고 넘길 수도 있다. 오늘따라 유난하다고 받아들일 수도 있다. 중요한 건 경비병이 같은 질문을 모두에게 하고 있지는 않다는 사실이다.`};

enc_hungry_child:{title:'빵 냄새를 따라온 아이',location:'창고 뒷길',text:s=>`창고 벽 아래 아이 하나가 웅크리고 앉아 있다. 얼굴보다 먼저 눈에 들어오는 건 시선이다. 아이는 당신을 보지 않고, 당신이 든 가방과 허리춤의 식량만 본다.

옷자락에는 말라붙은 진흙이 있고 신발 한쪽은 끈 대신 헝겊으로 묶여 있다. 이 도시에서 가난한 아이가 특별한 광경은 아니다. 다만 며칠 사이 북문 쪽 일용직이 줄었다는 이야기를 들었다면, 이 아이의 허기가 오늘 하루만의 일은 아닐 수도 있다.

당신이 멈춰 서자 아이가 몸을 조금 굳힌다. 달라고 먼저 말하지는 않는다. 거절당하는 일에도 품이 든다는 걸 이미 배운 얼굴이다.`,choices:scenes.enc_hungry_child.choices},
enc_runaway_cart:{title:'미끄러진 수레',location:'도시 경사로',onEnter:scenes.enc_runaway_cart.onEnter,text:s=>`비에 젖은 돌길에서 쇠테 두른 바퀴가 날카로운 소리를 낸다. 짐수레 하나가 경사를 거슬러 뒤로 밀리기 시작한다.

수레 아래쪽에는 빵 바구니를 든 노인이 있고, 수레 주인은 바퀴 옆에서 손잡이를 붙든 채 욕을 내뱉는다. 짐이 한쪽으로 쏠릴 때마다 수레가 반 뼘씩 방향을 튼다. 누구든 늦게 움직이면 사람 하나쯤 깔릴 거리다.

${hasFlag('수레 끈 먼저 봄')?'<span class="narrationEm">당신의 눈에는 사람들보다 먼저 오른쪽 고정끈이 들어온다. 젖은 매듭이 반쯤 풀려 있어 짐의 무게가 한쪽으로 쏠리고 있다. 힘으로 밀어받지 않아도 방향을 바꿀 방법이 있을지 모른다.</span>':'주변 사람들은 수레에만 시선이 꽂혀 있다. 누가 먼저 움직일지를 서로 기다리는 짧은 순간이 길게 늘어진다.'}`,choices:scenes.enc_runaway_cart.choices},
enc_pickpocket:{title:'너무 가벼운 충돌',location:'장터 골목',onEnter:scenes.enc_pickpocket.onEnter,text:s=>`장터 안쪽 골목은 두 사람이 어깨를 나란히 하고 걷기에도 좁다. 생선 비린내와 젖은 천 냄새 사이를 빠져나가던 순간, 작은 체구의 아이가 당신 어깨에 가볍게 부딪힌다.

“미안.”

말은 들렸는지조차 모르게 짧다. 아이는 고개도 들지 않고 사람들 사이로 미끄러져 들어간다.

${hasFlag('소매치기 손 포착')?'<span class="narrationEm">부딪힌 순간 아이의 손등이 주머니 입구를 훑는 것을 분명히 봤다. 실수로 닿은 손이 아니다.</span>':'몇 걸음 뒤에야 허리춤이 묘하게 가볍다는 느낌이 든다. 정말 무언가 없어졌는지, 단지 의심이 먼저 생긴 건지는 아직 확신할 수 없다.'}`,choices:scenes.enc_pickpocket.choices},
enc_lost_purse:{title:'주인 없는 은화',location:'시장과 성당 사이 길',text:s=>`시장과 성당 사이의 진흙길에 작은 가죽 주머니 하나가 반쯤 밟혀 있다. 발로 건드리자 묵직한 소리가 난다.

안에는 은화 여섯 닢과 기름때 묻은 영수증 한 장이 들어 있다. 영수증에는 약초상 이름과 해열 약재 몇 가지가 적혀 있다. 날짜는 오늘 아침이다.

고개를 들면 사람들은 제 갈 길을 간다. 주머니를 찾는 사람도, 당신 손을 유심히 보는 사람도 없다. 그래서 선택은 더 사소해 보이고, 어쩌면 더 온전히 당신 것이 된다.`,choices:scenes.enc_lost_purse.choices},
enc_rumor_knot:{title:'같은 소문의 세 버전',location:'공동 우물',onEnter:scenes.enc_rumor_knot.onEnter,text:s=>`공동 우물가에서는 물보다 이야기가 빨리 돈다. 오늘은 세 사람이 같은 일을 말하면서도 서로 다른 사건을 설명하고 있다.

한 사람은 북문 밖에서 죽은 사람이 걸어 다녔다고 하고, 다른 사람은 술 취한 사냥꾼 하나가 쓰러졌을 뿐이라고 한다. 세 번째 사람은 경비대가 무언가를 숨기려고 시체를 치웠다고 덧붙인다.

사람들은 사실을 확인하려고 모인 게 아니다. 불안에 이름을 붙이려고 모였다.

${hasFlag('소문 중심인물 파악')?'<span class="narrationEm">가만히 듣다 보니 두 사람이 자꾸 같은 빵집 여자의 말을 출처로 댄다. 세 갈래처럼 보였던 소문 중 적어도 둘은 같은 입에서 시작됐다.</span>':''}`,choices:scenes.enc_rumor_knot.choices},
enc_foreign_words:{title:'알아듣는 사람만 듣는 거래',location:'길모퉁이 노점',onEnter:scenes.enc_foreign_words.onEnter,text:s=>{const k=s.random.data.foreign,l=lang(k);const line=l>=7?'“북문 쪽 창고는 오늘 밤 비워. 땅 아래 소리가 심상치 않아.”':l>=4?'“북문… 창고… 오늘 밤… 비워. 아래… 소리.”':'익숙한 단어 몇 개가 귀에 걸리지만 문장의 뼈대는 흩어진다.';return `길모퉁이 천막 아래에서 외지 상인 둘이 서로 몸을 가까이 기울이고 ${LANG_NAMES[k]}로 낮게 말한다. 거래 이야기라기에는 가격이나 수량을 나타내는 손짓이 없다. 둘 다 자꾸 북문 쪽을 흘겨본다.

<span class="narrationEm">${line}</span>

모르는 사람에게는 그저 낯선 말소리다. 조금 아는 사람에게는 불길한 단어 몇 개고, 능숙한 사람에게는 남들이 아직 듣지 못한 정보다. 같은 거리에 서 있어도 언어에 따라 존재하는 세계가 달라진다.`},choices:scenes.enc_foreign_words.choices},
enc_lost_elf_child:{title:'말이 통하지 않는 아이',location:'중앙 장터 천막 사이',text:s=>`푸른 머리끈을 맨 어린 엘프가 천막과 천막 사이에 서 있다. 울고 있지는 않지만 발끝이 어느 방향으로도 움직이지 못한다.

지나가는 인간 상인이 공용어로 부모 이름을 묻자 아이는 입을 다문다. 못 알아듣는 건지, 알아듣고도 겁이 나서 대답하지 않는 건지 주변 사람들은 구분하지 못한다.

당신이 가까이 가자 아이는 먼저 당신 얼굴과 귀, 옷차림을 차례로 본다. ${lang('elven')>=5?'엘프어로 조심스럽게 “상단을 놓쳤어요.”라고 말한다.':lang('elven')>=2?'“상단… 없어… 엄마…” 정도의 말만 알아들을 수 있다.':'말은 거의 알아들을 수 없다. 다만 아이가 같은 문양이 그려진 수레 깃발을 자꾸 찾는다는 건 보인다.'}

도움이 필요한 건 분명하지만, 무엇을 해야 하는지는 당신이 가진 언어와 눈에 따라 다르게 보인다.`,choices:scenes.enc_lost_elf_child.choices},
enc_funeral:{title:'이름을 모르는 장례',location:'북문 성당 옆길',text:s=>`종이 세 번 울리고 작은 장례 행렬이 골목을 막는다. 관은 하나, 뒤따르는 사람은 다섯뿐이다. 비에 젖은 관 뚜껑에는 이름패도 달려 있지 않다.

주변 가게들은 잠깐 목소리를 낮추지만 문을 닫지는 않는다. 며칠 전까지라면 누가 죽었는지부터 물었을 사람들이 오늘은 묻지 않는다. 모르는 편이 마음 편한 소식이 늘어났기 때문이다.

토마가 행렬 끝에서 향을 들고 걷는다. 당신을 알아보고 눈을 마주치지만, 먼저 말을 걸지는 않는다.`,choices:scenes.enc_funeral.choices},
enc_night_hum:{title:'돌 아래에서 나는 낮은 소리',location:'북문 돌길',text:s=>`밤의 북문 돌길은 낮과 다른 장소처럼 보인다. 상점 덧문은 닫혀 있고 멀리 초소의 횃불만 바람에 흔들린다.

몇 걸음 걷던 중 발바닥을 통해 아주 낮은 진동이 올라온다. 귀로 듣는 소리라기보다 어금니 안쪽이 한 번씩 울리는 느낌이다. 멈추면 사라지고, 다시 걸으면 일정한 간격을 두고 되돌아온다.

지나가던 사람 둘은 아무 반응 없이 당신을 스쳐 간다.

${highestRes()>=10?'<span class="narrationEm">그때 당신 안의 어떤 공명이 진동보다 한 박자 늦게, 아주 희미하게 대답한다. 몸 밖의 소리를 들은 것인지 몸 안의 소리를 들은 것인지 구분하기 어렵다.</span>':'돌 틈에 손을 가까이 대도 바람은 느껴지지 않는다. 소리의 근원은 길 위가 아니라 아래에 있는 듯하다.'}`,choices:scenes.enc_night_hum.choices},
enc_well_quarrel:{title:'우물 앞의 순서',location:'공동 우물',text:s=>`공동 우물 앞 줄이 평소보다 두 배는 길다. 물 자체가 부족한 건 아닌데, 북문 쪽 우물이 오염됐다는 소문 때문에 사람들이 이곳으로 몰렸다.

인간 여자 하나와 고블린 노인이 양동이 손잡이를 사이에 두고 언성을 높인다. 누가 먼저 왔는지에서 시작한 싸움은 금세 “너희 같은 것들”과 “인간들은 늘” 같은 말로 바뀐다.

주변 사람 몇은 말릴 생각보다 어느 쪽이 이기는지를 보는 표정이다. 물 한 양동이의 순서가 오래된 불만을 꺼내는 핑계가 되고 있다.`,choices:scenes.enc_well_quarrel.choices}
});




// 관계가 깊어지면 일부 대화에서 실제 이름을 부른다. 렌더링할 때마다 바뀌지 않도록 장면/턴 기반으로 결정한다.
function addressPlayerInSpeech(id,raw){
 if(!state?.name||state.name==='여행자'||String(raw).includes(state.name))return raw;
 const rel=effectiveRel(id);if(rel<18)return raw;
 const cadence=id==='toma'?4:id==='mara'?5:id==='laen'?5:6;
 let hash=state.day*31+(state.turn||0)*17+id.length*11+String(raw).length;
 if(hash%cadence!==0)return raw;
 let call=state.name;
 if(state.status==='하급 귀족'&&rel<30&&['adel','orban','mark'].includes(id))call=playerTitle();
 return `${call}, ${raw}`;
}
// 기존 dlg와 같은 언어 처리에 이름 호칭만 얹는다.
dlg=function(id,line,place=state.location,language=null){const n=NPC[id];let raw=nameLine(typeof line==='function'?line(state):line);raw=naturalNpcSpeech(id,raw);raw=addressPlayerInSpeech(id,raw);const speechLang=language||(id==='laen'&&isSpecies('엘프')?'elven':'common');const shown=heardSpeech(raw,speechLang);return `<div class="dialogue"><div class="speaker">${n.name}<small>${n.role} / ${place} / ${relLabel(effectiveRel(id))}</small></div><div class="line">“${shown}”</div></div>`};

// 획득형 내성. 대부분의 사람은 0에서 시작하고, 실제 경험을 통해서만 생긴다.
const RESIST_NAMES={poison:'독',disease:'질병',bleed:'출혈',fire:'화염',cold:'냉기',lightning:'전기',fear:'공포',mental:'정신 침식',curse:'저주',death:'죽음의 기운',holy:'신성력'};
function resistance(k){return state?.resistances?.[k]||0}
function gainResistance(k,amount=1,reason='',announce=true){state.resistances=state.resistances||{};const before=resistance(k);state.resistances[k]=clamp(before+amount,0,80);if(reason){state.resistanceHistory=state.resistanceHistory||[];state.resistanceHistory.unshift({day:state.day,key:k,delta:amount,reason});state.resistanceHistory=state.resistanceHistory.slice(0,20)}if(announce&&state.resistances[k]>before)system(`${RESIST_NAMES[k]||k} 내성이 ${state.resistances[k]}%로 상승했습니다.`, 'good')}
function ensureLifeSystems(){state.resistances=state.resistances||{};state.resistanceHistory=state.resistanceHistory||[];state.personalHistory=state.personalHistory||[]}
function lifeRecord(kind,text){ensureLifeSystems();if(!text)return;state.personalHistory.unshift({day:state.day,hour:state.hour,kind,text});state.personalHistory=state.personalHistory.slice(0,80)}

// 시간이 지나며 같은 사람의 '현재 역할'도 바뀐다. 관계창과 대사 머리말에 반영된다.
for(const n of Object.values(NPC))if(!n.baseRole)n.baseRole=n.role;
function refreshNpcRoles(){if(!state)return;for(const n of Object.values(NPC))n.role=n.baseRole;
 if(state.day>=2)NPC.iren.role=state.city.infection>=25?'떠돌이 의사 / 열병 대응':'떠돌이 의사';
 if(state.day>=3)NPC.adel.role='북문 성당 부사제 / 임시 구호 책임';
 if(state.day>=3)NPC.toma.role='성당 견습서기 / 환자 기록 담당';
 if(state.day>=4)NPC.mark.role=state.city.panic>=45?'성문 경비대 하급병 / 대피 유도':'성문 경비대 하급병 / 북문 경계조';
 if(state.day>=4)NPC.orban.role='도시 경비대 부대장 / 비상 지휘';
 if(state.city.food<50||state.city.panic>35)NPC.nadia.role='중앙 장터 잡화상 / 물자 중개';
 if(state.day>=4)NPC.mara.role='남쪽 밭 임차농 / 식량 운송 협력';
 if(state.day>=3)NPC.bram.role='북문 여관 주인 / 피난객 숙소 관리';
 if(hasFlag('라엔 가족사'))NPC.laen.role='북방 엘프 행상인 / 옛길 탐색자';
 if(hasFlag('조부 대화 성공'))NPC.laen.role='북방 엘프 / 귀환자의 후손';
 if(hasFlag('혼합문자 해독')||hasFlag('성당 엘프문자 선취'))NPC.seln.role='도시 기록관 / 고대 도로 기록 조사';
}
const render08life=render;
render=function(){ensureLifeSystems();refreshNpcRoles();return render08life()};

// 기존 출신들도 새 출신과 같은 밀도로 첫 장면을 갖는다.
scenes.prelude_noble.text=s=>`마차 바퀴가 진흙을 튀길 때마다 창문 아래쪽이 갈색으로 흐려진다. 멀리서 보면 변경도시 성벽은 단단해 보이지만 가까이 오면 빗물 자국과 급히 덧댄 돌이 먼저 보인다.

당신의 옷은 장터를 오가는 사람들보다 깨끗하고, 허리춤 안쪽에는 작은 가문 인장이 있다. 대단한 권력을 보장하는 물건은 아니다. 하지만 성문에서 시비가 붙었을 때 상대가 한 번 더 생각하게 만들기에는 충분하다.

가문 이름은 문을 열어준다. 동시에 당신의 실수에 성을 붙여 소문내기도 한다.

오늘만큼은 어느 쪽의 사람이 되어 도시 안으로 들어갈지 결정해야 한다.`;
scenes.prelude_market.text=s=>`${dlg('nadia','{name}, 소금 세 자루 가격 좀 보고 와. 비 그친 다음 날엔 다들 세상이 끝난 줄 알고 값을 올리거든.')}

나디아는 동전 세 닢을 손바닥 위에서 튕긴 뒤 다시 서랍에 넣는다. 실제로 사오라는 뜻이 아니라 시세만 확인하라는 뜻이다.

장터로 나가 보니 평소보다 덧문을 반쯤만 연 가게가 많다. 비 때문인지 북문 쪽 소문 때문인지는 아직 모른다. 사람들은 물건값을 묻다가도 누가 ‘북쪽’이라는 말을 꺼내면 한 번씩 고개를 든다.

당신에게 그런 얼굴 변화도 가격표의 일부다.`;
scenes.prelude_church.text=s=>`새벽 기도가 끝난 뒤에도 북문 성당에는 촛불 냄새가 남아 있다. 당신 손톱 밑에는 어제 긁어낸 촛농이 아직 조금 끼어 있다.

${dlg('adel','{name}, 장터에서 붕대와 소금을 조금 더 구해오세요. 북쪽 농가에서 열병 환자가 들어올 수도 있다는 연락이 왔습니다.')}

아델은 ‘열병’이라는 단어를 특별히 낮추지도 높이지도 않는다. 제단 뒤에서는 토마가 빈 침상 수를 세고 있고, 창고지기는 물통을 하나 더 씻는다.

아직 아무도 이 일을 재앙이라고 부르지 않는다. 지금은 그저 오늘 안에 환자가 몇 명 더 올지도 모른다는 준비다. 큰 사건은 대개 이렇게 하찮은 수량부터 늘어난다.`;
scenes.prelude_guard.text=s=>`${dlg('mark','{name}, 아침부터 사람 많다. 비 그쳤다고 다들 한꺼번에 기어나왔어.')}

동문 초소 앞에는 젖은 짐수레가 두 줄로 서 있다. 경비병들은 통행패를 확인하고, 상인들은 세금이 어제와 같은지부터 묻는다. 어린 시절부터 이 근처를 드나든 당신에게는 욕설 섞인 말투도, 갑자기 조용해지는 순간도 낯설지 않다.

마르크가 턱으로 쓰러진 표지판을 가리킨다. 도와달라는 말은 하지 않는다. 서로 아는 사이에서는 부탁도 종종 명령처럼 짧아진다.

오늘 당신은 경비병이 아니다. 그렇다고 이들의 세계와 완전히 무관한 사람도 아니다.`;
scenes.prelude_street.text=s=>`장터가 열리기 전부터 골목은 이미 하루를 시작한다. 빵집 심부름꾼은 어제 남은 빵을 뒤문으로 옮기고, 술이 덜 깬 경비병은 순찰길을 짧게 잡으며, 외지 상인의 짐꾼은 사람 없는 곳에서 허리띠를 다시 맨다.

당신은 간판보다 사람을 먼저 본다. 누가 돈을 가졌는지, 누가 화가 났는지, 누가 누구를 보고 길을 바꾸는지. 그런 걸 알아채는 일은 글을 읽는 것만큼이나 먹고사는 데 쓸모가 있었다.

오늘은 조금 다르다. 북문 쪽에서 내려온 사람들이 평소보다 자주 뒤를 돌아본다. 아직 무슨 일이 있다는 말은 없지만, 골목은 공식 발표보다 먼저 분위기를 바꾸는 법이다.`;
scenes.prelude_elf_city.text=s=>`당신은 공용어로 생각하고 공용어로 꿈꾼다. 어릴 적 식탁에서 들은 농담도, 화가 났을 때 가장 먼저 떠오르는 욕도 인간의 말이다.

그래도 성문 앞처럼 낯선 사람이 많은 곳에 서면 가끔 자신의 귀를 먼저 의식한다. 처음 보는 사람은 당신에게 엘프어로 말을 걸고, 당신이 잠깐 대답을 고르면 이상하다는 표정을 짓는다. 반대로 북방 엘프와 마주치면 그들은 당신의 옷과 억양을 먼저 본다.

오늘 장터에는 북방 엘프 상단이 들어왔다는 소문이 있다. 같은 얼굴을 한 낯선 사람을 일부러 찾아가 볼지, 평소처럼 인간 도시의 하루를 살지는 당신 몫이다.`;
scenes.prelude_elf_north.text=s=>`인간 성벽은 북방의 나무 울타리보다 높고, 입구는 생각보다 좁다. 외지 상인들이 한 줄로 세워져 통행세를 내는 동안 성벽 위에서는 젖은 깃발이 무겁게 늘어진다.

경비병의 공용어는 너무 빠르다. 숫자, 세금, 멈추라는 말은 놓치지 않지만 농담과 욕설이 섞이면 문장의 끝이 흐려진다. 알아들은 척 고개를 끄덕이는 일도 여행 기술 중 하나다.

당신보다 몇 사람 앞에 선 엘프 행상인 하나가 경비병과 언성을 높이고 있다. 그의 엘프어는 또렷하다. 문제는 그 말을 인간 경비병이 전혀 다르게 받아들이고 있다는 데 있다.

같은 종족이라고 해서 반드시 끼어들 의무가 생기는 것은 아니다. 하지만 무엇이 잘못 번역되고 있는지는 당신에게만 선명하게 들린다.`;
scenes.prelude_smith.text=s=>`대장간은 해가 뜨기 전부터 뜨겁다. 오늘은 젖은 장작 때문에 불이 자꾸 죽어 연기가 천장 아래에 낮게 깔린다. 소매에는 쇳가루가 붙고 입안에는 금속 맛이 돈다.

스승은 밤새 수리한 농기구 하나를 당신 손에 쥐여준다. 날이 아니라 자루와 날을 잇는 목 부분이 부러졌던 물건이다.

“장터 농부에게 돌려줘. 그리고 다시 헐거우면 돈 받지 말고 가져오라 해.”

금속은 사람보다 솔직하다는 생각이 들 때가 있다. 두드린 자리와 금 간 자리를 숨기지 않는다. 그런데 도시의 오래된 금속은 가끔 누가 만들었는지보다 더 오래된 이야기를 품고 있다.`;
scenes.prelude_farm.text=s=>`사흘 비가 그친 뒤 농로는 길이라기보다 얕은 진흙탕에 가깝다. 마레나의 수레 한쪽 바퀴가 축 가까이까지 빠졌고, 오늘 장터에 내놓을 채소 포대는 비닐도 없는 천 아래에서 축축하게 눌린다.

${dlg('mara','{name}, 도시 들어가기 전부터 이 꼴이네. 비는 그쳤는데 땅이 사람 발목을 잡아.')}

마레나는 허리춤을 걷어 올리고 바퀴 옆 흙을 발로 밀어낸다. 욕을 하면서도 젖은 채소가 얼마나 상했는지부터 눈으로 센다.

당신에게 도시는 모험이 시작되는 장소가 아니다. 오늘 물건을 얼마에 팔 수 있는지, 돌아오는 길에 소금을 살 수 있는지, 다음 비가 오기 전에 밭고랑을 손볼 돈이 남는지가 먼저다. 세계의 큰일도 그런 하루 안으로 들어와야 비로소 당신 일이 된다.`;

// 중요한 선택의 사회적 의미가 '숫자'보다 먼저 사람의 기억으로 남도록 한다.
function rememberByValues(tags=[],summary='',source='직접 경험'){
 if(!summary)return;
 const seen=Object.keys(NPC).filter(id=>hasFlag('met_'+id));
 for(const id of seen){const vals=NPC[id].values||{};let score=0;for(const t of tags)score+=vals[t]||0;if(!score)continue;rememberNPC(id,summary,source,source==='직접 경험'?95:65,score>0?'호의':'경계');if(score>=4)modImpression(id,{respect:1,trust:1});else if(score>=2)modImpression(id,{respect:1});else if(score<=-4)modImpression(id,{trust:-2});else if(score<=-2)modImpression(id,{trust:-1})}
}

// 공개 행동은 소문과 집단 평판뿐 아니라 이미 알고 지내는 사람들의 가치관에도 걸린다.
const publicDeed08=publicDeed;
publicDeed=function(changes,reason,witness='사람들 앞에서',tags=[]){publicDeed08(changes,reason,witness);if(tags?.length)rememberByValues(tags,reason,'전해 들은 소문')};

function conditionWord(v,good='안정',mid='불안정',bad='위험'){return v>=67?good:v>=36?mid:bad}
function chapterCityAftermath(){
 const c=state.city;
 const infection=c.infection<25?'열병은 더 번지지 않고 잦아드는 기미를 보인다.':c.infection<55?'열병은 남았다. 성당과 약초상에는 며칠 더 긴 줄이 이어질 것이다.':'열병은 끝나지 않았다. 도시가 살아남았다는 말과 사람들이 살아남았다는 말이 아직 같은 뜻은 아니다.';
 const panic=c.panic<25?'장터는 조심스럽게 제 속도를 되찾는다.':c.panic<60?'소문은 여전히 빠르고, 사람들은 북문을 지날 때 걸음을 재촉한다.':'문은 닫히지 않았지만 사람들의 마음은 이미 여러 갈래로 갈라졌다.';
 const food=c.food>=60?'곡물값은 버틸 만한 선에서 멈췄다.':c.food>=35?'식량값은 올랐고 가난한 집부터 끼니를 줄인다.':'창고 앞에 줄이 생긴다. 다음 주의 문제는 괴물이 아니라 빵일지도 모른다.';
 return `${infection} ${panic} ${food}`;
}
function chapterPeopleAftermath(){
 const met=Object.keys(NPC).filter(id=>hasFlag('met_'+id));
 if(!met.length)return '<div class="item">이번 일주일 동안 끝내 깊이 알게 된 사람은 없었다. 그것 또한 한 삶의 모양이다.</div>';
 return met.map(id=>({id,v:effectiveRel(id)})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,4).map(({id,v})=>{const n=NPC[id];let line='';
  if(id==='laen')line=v>=35?'라엔은 떠나기 전 당신의 이름을 엘프어로 한 번 적어준다. 다음에 만났을 때도 알아보겠다는 뜻이다.':v<=-15?'라엔은 떠날 때 작별 인사를 하지 않는다. 같은 진실을 보았다고 같은 편이 되는 것은 아니었다.':'라엔과 당신 사이에는 아직 질문이 더 많이 남아 있다. 다시 만난다면 첫 만남과는 다른 대화를 하게 될 것이다.';
  else if(id==='mark')line=v>=30?'마르크는 초소 장부에 당신을 민간 협조자로 적는다. 칭찬이라기보다 다음에도 부르겠다는 뜻에 가깝다.':v<=-15?'마르크는 당신을 볼 때마다 먼저 손부터 확인한다. 경비대의 기억은 개인 감정보다 오래 갈 수 있다.':'마르크는 여전히 퉁명스럽지만 이제 당신을 완전한 외지인처럼 보지는 않는다.';
  else if(id==='adel')line=v>=30?'아델은 성당 기록의 여백에 당신의 증언을 별도로 남긴다. 정식 교리와 맞지 않는 부분도 지우지 않는다.':v<=-15?'아델은 당신과 나눈 대화를 기록하되, 신뢰할 수 없는 증언이라는 주석을 붙인다.':'아델은 판단을 보류한다. 그에게 판단 보류는 거절보다 오래 가는 관심일 수 있다.';
  else if(id==='iren')line=v>=30?'이렌은 떠나기 전 약병 하나와 짧은 편지를 남긴다. 다음에 더 위험한 것을 보게 되면 먼저 자신에게 가져오라는 내용이다.':v<=-15?'이렌은 당신이 보는 앞에서는 더 이상 표본 상자를 열지 않는다. 호기심은 남았지만 신뢰는 남지 않았다.':'이렌은 당신을 흥미로운 협력자 정도로 기억한다. 사람을 그렇게 분류하는 것이 그에게는 꽤 높은 평가다.';
  else if(id==='nadia')line=v>=25?'나디아는 다음 거래부터 값을 먼저 깎지 않는다. 장터 사람에게는 그것만으로도 제법 긴 신뢰다.':v<=-15?'나디아는 웃으며 거래하지만 외상은 절대 주지 않는다.':'나디아는 당신이 무엇을 사고팔았는지, 그리고 무엇을 돈으로 바꾸지 않았는지 기억한다.';
  else if(id==='mara')line=v>=25?'마레나는 남쪽 밭에 오면 품삯 대신 밥부터 먹으라고 한다.':'마레나는 당신을 평가할 때 여전히 말보다 손을 본다.';
  else if(id==='orban')line=v>=25?'오르반은 당신을 명령받는 민간인이 아니라 계산에 넣어야 할 사람으로 보기 시작한다.':v<=-15?'오르반의 보고서에서 당신 이름 옆에는 작은 표시가 하나 붙는다. 좋은 뜻은 아니다.':'오르반에게 당신은 아직 유용할 수도, 위험할 수도 있는 변수다.';
  else if(id==='toma')line=v>=25?'토마는 당신과 본 것을 몰래 별도 장부에 옮겨 적는다. 언젠가 정식 기록보다 그 장부가 더 중요해질 수도 있다.':'토마는 다음에 만나면 물어볼 질문을 벌써 몇 개 적어뒀을 것이다.';
  else line=`${n.name}에게 당신은 이제 이름 없는 행인이 아니다.`;
  return `<div class="item"><b>${n.name}</b> — ${relLabel(v)}<div class="dim" style="margin-top:4px;line-height:1.6">${line}</div></div>`
 }).join('');

function chapterReputationAftermath(){

function inferActionTags(reason=''){
 const tags=[];const add=t=>{if(!tags.includes(t))tags.push(t)};
 if(/돕|구조|먹을|나눴|환자|시신|장례|아이/.test(reason)){add('mercy');add('responsibility')}
 if(/돌려|반환|약속|지켰/.test(reason)){add('honesty');add('promise');add('reciprocity')}
 if(/경비|검문|질서|통제|봉쇄|다툼을.*정리|중재/.test(reason)){add('order');add('responsibility')}
 if(/기록|해독|원인|밝혀|조사|문자|증언|관찰/.test(reason)){add('knowledge');add('curiosity')}
 if(/가격|시세|상단|거래|재고|통행세/.test(reason)){add('trade');add('practical')}
 if(/성당|기도|교단|장례/.test(reason))add('faith')
 if(/위험|대피|살아|봉쇄|구조/.test(reason)){add('survival');add('risk')}
 if(/거짓|속였|기만|둘러댔/.test(reason))add('deception')
 if(/농가|밭|수레|작물|품삯/.test(reason)){add('labor');add('practical')}
 if(/엘프|오크|고블린|차별|선별 검문/.test(reason))add('dignity')
 return tags;
}

function ensureLife10(){
 if(state.chaosResonance===undefined)state.chaosResonance=Math.max(0,Math.min(100,Math.round((state.fate||50)/18-1)));
 if(!state.birthRegion)state.birthRegion=originRegion(origins.find(o=>o.key===state.originKey)||{key:state.originKey});
 if(!state.dailySummary)state.dailySummary={};
 if(!state.worldKnowledge)state.worldKnowledge=[];
 if(!state.statusEffects)state.statusEffects=[];
 if(!state.historyLog)state.historyLog=[];
 if(!state.languages.eastcommon)state.languages.eastcommon=state.languages.eastcommon||0;
}
function modChaos(v,reason=''){ensureLife10();state.chaosResonance=clamp(state.chaosResonance+v,0,100);if(reason&&state.chaosResonance>=18&&skill('arcana')>=2)addLog(`설명하기 어려운 공명 불협화음: ${reason}`)}
function chaosWhisper(){ensureLife10();const c=state.chaosResonance;if(c<18)return '';if(c<35)return '<span class="hiddenHint">아홉 공명 가운데 어디에도 정확히 들어맞지 않는 잔향이 아주 짧게 스친다.</span>';if(c<60)return '<span class="hiddenHint">익숙한 아홉 결 사이에서 박자가 하나 어긋난다. 무엇의 힘인지는 아직 이름 붙일 수 없다.</span>';return '<span class="hiddenHint">아홉 방향을 세고도 하나가 남는다. 그것이 바깥에서 들어오는지, 당신 안에서 생기는지는 알 수 없다.</span>'}

const recalc09=recalc;
recalc=function(init=false){
 recalc09(init);ensureLife10();
 const s=state.stats, exhausted=pct('stamina')<20?-8:pct('stamina')<40?-3:0, wounded=pct('hp')<25?-7:pct('hp')<50?-3:0;
 const burden=state.statusEffects?.includes('중량초과')?-8:0;
 state.derived.speed=clamp(Math.round(18+s.dex*.68+s.vit*.05+skill('athletics')*1.7+exhausted+burden),1,99);
 state.derived.accuracy=clamp(Math.round(22+s.dex*.55+s.wis*.16+skill(hasItem('sword')?'sword':'unarmed')*.9+wounded),1,99);
 state.derived.evasion=clamp(Math.round(12+s.dex*.57+s.wis*.10+skill('athletics')*1.35+exhausted+burden),1,99);
};

function updateRecordStrip10(){const el=document.getElementById('recordStrip');if(!el||!state)return;ensureLife10();const nm=playerName(), lvl=Math.max(1,Math.floor(Object.values(state.skills||{}).reduce((a,x)=>a+(x.lv||0),0)/8)+1);el.innerHTML=`<div class="charLine"><b>${nm}</b> / ${state.species} / ${state.origin} / 삶의 숙련 ${lvl} / ${conditionWord()}</div><div class="worldLine">인간력 30년 / ${state.day}일차 ${String(state.hour).padStart(2,'0')}:${String(state.minute).padStart(2,'0')} / ${state.location}</div>`}
function recordEvent10(text,type='사건'){ensureLife10();state.historyLog.push({day:state.day,hour:state.hour,minute:state.minute,type,text});if(state.historyLog.length>180)state.historyLog=state.historyLog.slice(-180)}
const addLog10=addLog;
addLog=function(text){addLog10(text);if(state&&text&&!/저장된 진행/.test(text))recordEvent10(text,'기록')};
function daySummaries10(){ensureLife10();const days={};for(const x of state.historyLog){(days[x.day]??=[]).push(x)}return Object.entries(days).sort((a,b)=>Number(b[0])-Number(a[0])).map(([d,arr])=>`<div class="recordDay">${d}일차</div>${arr.slice(-8).map(x=>`<div class="recordEvent"><b>${String(x.hour).padStart(2,'0')}:${String(x.minute).padStart(2,'0')}</b> ${x.text}</div>`).join('')}`).join('')||'<span class="dim">아직 기록이 없습니다.</span>'}

scenes.v11_route_livelihood={title:'먹고사는 길',location:'변경도시로 이어지는 길',onEnter:s=>{advance(0,35);modRes({stamina:-4});s.departure.route='livelihood'},text:s=>`길 위에서 만나는 사람들은 같은 방향으로 가면서도 이유가 다르다. 품삯, 세금, 약재, 편지, 수리할 물건.\n\n변경도시는 모험가가 모이는 장소라기보다 주변 수십 마을의 하루가 모이는 시장이다. 그래서 길 하나가 막히면 물가부터 오르고, 사람 하나가 사라지면 그 사람 몫의 일이 다른 사람에게 넘어간다.\n\n오늘은 북문으로 들어와야 할 수레가 유난히 적다.`,choices:[choice('도시에 들어가 내가 하려던 일부터 한다.','v11_arrival',{do:s=>bumpThread('society',4)}),choice('길가 수레와 마부들에게 북문 사정을 묻는다.','v11_route_people',{do:s=>{gainSkill('persuasion',1);bumpThread('fever',2)}})]};
scenes.v11_route_signs={title:'흔적은 말을 하지 않는다',location:'변경도시 바깥의 오래된 길',onEnter:s=>{advance(0,30);modRes({stamina:-5});s.departure.route='signs'},text:s=>`평소와 다른 것은 하나뿐이면 우연일 수 있다. 문제는 오늘 아침부터 작은 이상이 여러 개 겹친다는 점이다.\n\n물 빠진 도랑 아래의 미지근한 바람. 짐승 발자국이 갑자기 끊기는 자리. 두드린 뒤 한 박자 늦게 울리는 도로석. 북쪽에서 내려온 사람들의 검은 기침 자국.\n\n어느 하나도 아직 답은 아니다. 그러나 모두 오래된 길과 변경도시 북쪽을 향한다.`,choices:[choice('표지석과 지반부터 살피며 도시 쪽으로 간다.','v11_arrival',{do:s=>{bumpThread('oldroad',5);if(skill('observation')>=2)knowSuspicion('도시 바깥의 여러 이상 징후가 오래된 북방로 주변에 겹친다.')}}),choice('사람이 사는 곳으로 돌아가 증언과 비교한다.','v11_route_people',{do:s=>bumpThread('society',2)})]};
scenes.v11_route_people={title:'사람은 사실보다 먼저 두려워한다',location:'변경도시 외곽 쉼터',onEnter:s=>{advance(0,25);s.departure.route='people'},text:s=>`쉼터에는 서로 모르는 사람들이 같은 소문을 조금씩 다르게 말한다.\n\n누군가는 북쪽 농가에 열병이 돈다고 하고, 누군가는 공동묘지 흙이 내려앉았다고 한다. 상인은 마부가 사라졌다고 하고, 아이는 밤에 숲에서 사람이 걸어왔다고 한다.\n\n같은 사건인지, 사람들이 불안을 한데 묶고 있는 것인지는 아직 알 수 없다.`,choices:[choice('환자와 구휼 수레가 향한 북문 쪽으로 간다.','v11_arrival',{do:s=>{bumpThread('fever',7);knowSuspicion('북문 열병, 실종, 지반 이상이 같은 시기에 겹치고 있다.')}}),choice('장터에서 실제 가격과 출입 기록부터 확인한다.','v11_arrival',{do:s=>{bumpThread('society',6);gainSkill('trade',1)}})]};
scenes.v11_departure_delay={title:'움직이지 않는 동안에도',location:s=>departureInfo11()[0],onEnter:s=>{advance(2,0);state.city.infection+=2;state.world.roadSafety=clamp(state.world.roadSafety-2,0,100);scheduleConsequence('v11_delay_echo',1,{})},text:s=>`당신이 움직이지 않는 동안에도 다른 사람들은 움직인다. 수레는 다른 길을 택하고, 환자는 성당으로 옮겨지고, 경비대는 북문 장부에 새로운 이름을 적는다.\n\n정오가 가까워질 무렵, 처음 들었던 소문 가운데 하나가 확인된다. 북쪽에서 돌아오지 않은 사람이 실제로 있다.\n\n아무것도 하지 않는 선택도 시간을 쓴다.`,choices:[choice('이제 변경도시로 향한다.','v11_arrival',{do:s=>{bumpThread('society',2);bumpThread('fever',2)}})]};
scenes.v11_delay_echo={title:'하루 늦게 돌아온 소문',location:'중앙 장터',text:s=>`${encounterBadge11('v11_delay_echo')}당신이 전날 지켜보기만 했던 사이, 북문 실종 이야기는 장터 전체에 퍼졌다. 사실은 한 사람이었지만 소문 속에서는 셋이 되었다.\n\n시간을 두면 진실이 선명해지는 일도 있다. 반대로 빈자리를 소문이 먼저 채우는 일도 있다.`,choices:[choice('사실과 소문을 따로 적어둔다.',s=>s.random.returnTo||'day1_hub',{do:s=>{knowFact('북문 실종자는 적어도 한 명 실제로 확인되었다.');knowSuspicion('장터에서는 실종자 수가 과장되어 퍼지고 있다.');bumpThread('society',3)},noEncounter:true})]};
scenes.v11_arrival={title:'변경도시에는 한 개의 입구만 있는 것이 아니다',location:'서부대륙 변경도시 외곽',onEnter:s=>{ensureV11();s.departure.arrived=true;flag('랜덤인카운터 해금');lifeRecord('이동','서부 변경도시에 도착했다.')},text:s=>`성벽이 보인다. 그러나 당신이 무엇을 먼저 보는지는 살아온 삶에 따라 다르다.\n\n상인은 줄어든 수레 수를 보고, 사냥꾼은 성문 가까이까지 내려온 새 발자국을 본다. 성당 사람은 구휼 수레를 보고, 경비 경험이 있는 사람은 창 위에 묻은 진흙과 교대 인원을 본다. 엘프는 인간의 시선과 북방 억양을 먼저 듣고, 동부 출신은 낯선 행정 절차와 익숙하지 않은 평화를 함께 본다.\n\n동문에서는 외지 엘프 하나가 경비병과 말다툼 중이다. 북문에서는 들것이 들어온다. 중앙 장터에서는 소금값이 다시 적힌다. 성벽 밖 오래된 도로석에는 빗물이 고여 있다.\n\n<b>라엔을 만나지 않아도, 폐역참에 가지 않아도, 이 삶은 이미 시작되었다.</b>`,choices:s=>[
 choice('내 일과 숙소부터 정한다.','day1_hub',{do:s=>bumpThread('society',4),review:s=>'당신은 사건의 이름부터 붙이기보다 오늘 머물 곳과 할 일을 먼저 정합니다.'}),
 choice('북문으로 들어오는 환자를 따라간다.','church_sick',{do:s=>bumpThread('fever',9),review:s=>'당신은 소문보다 아픈 사람을 먼저 봅니다. 북문의 이상은 여기서 열병이라는 얼굴을 얻습니다.'}),
 choice('오래된 도로석과 지반을 확인한다.','oldroad_alone',{do:s=>bumpThread('oldroad',9),review:s=>'당신은 사람보다 길에 남은 흔적을 먼저 따라갑니다. 폐역참은 라엔의 사연이 아니라 오래된 교역망의 문제로 처음 모습을 드러냅니다.'}),
 choice('동문의 말다툼을 보러 간다.','intro_laen',{do:s=>{bumpThread('society',3);bumpThread('oldroad',2)},review:s=>'당신은 동문의 충돌로 향합니다. 그곳에서 라엔을 만나게 되지만, 그는 당신 삶의 시작점이 아니라 오늘 마주친 여러 사람 가운데 하나입니다.'}),
 choice('가격과 출입 장부를 비교한다.','work_market',{do:s=>bumpThread('society',8),review:s=>'당신은 장터의 숫자를 택합니다. 길이 막히면 전설보다 먼저 가격이 움직입니다.'})
]};

// 메인 사건은 여러 실마리가 일정 수준 쌓이면 서로 연결된다.
function syncMainThreads11(){ensureV11();if(hasFlag('검은 실핏줄'))bumpThread('fever',Math.max(0,18-state.mainThreads.fever));if(hasFlag('옛길 첫 공명')||hasFlag('폐역참 도착'))bumpThread('oldroad',Math.max(0,22-state.mainThreads.oldroad));if(hasFlag('검은 문 조우')||hasFlag('지하 맥동 감지'))bumpThread('under',Math.max(0,25-state.mainThreads.under));if(state.city.panic>30||state.world.rumorHeat>25)bumpThread('society',2)}
const go11base=go;go=function(id){syncMainThreads11();return go11base(id)};

// 5계층 랜덤 인카운터. 무시한 사건은 압력으로 남아 이후 재등장/확대될 수 있다.
const ENCOUNTER_META_11={
 enc_beggar:{cat:'daily'},enc_runaway_cart:{cat:'daily'},enc_lost_purse:{cat:'daily'},enc_hungry_child:{cat:'daily'},enc_old_soldier:{cat:'daily'},enc_dead_bird:{cat:'local'},enc_injured_orc:{cat:'social'},enc_lost_elf_child:{cat:'social'},enc_well_quarrel:{cat:'social'},enc_checkpoint:{cat:'social'},enc_guard_bribe:{cat:'social'},enc_price_panic:{cat:'social'},enc_rumor_knot:{cat:'social'},enc_foreign_words:{cat:'history'},enc_wandering_scribe:{cat:'history'},enc_east_broadside:{cat:'history'},enc_jiangshi_talisman:{cat:'history'},enc_martial_caravan:{cat:'history'},enc_current_sailor:{cat:'history'},enc_rain_shrine:{cat:'strange'},enc_black_dog:{cat:'strange'},enc_night_hum:{cat:'strange'},enc_resonant_stone:{cat:'strange'},enc_false_relic:{cat:'strange'},enc_refugee_cart:{cat:'local'},enc_funeral:{cat:'local'},enc_guild_invite:{cat:'social'},enc_pickpocket:{cat:'daily'},
 enc_jiangshi_scarecrow:{cat:'history',major:true},enc_golem_tax:{cat:'social',major:true},enc_resonance_debt:{cat:'strange',major:true},enc_mithril_knock:{cat:'strange',major:true}
};
function encounterWeight11(id){ensureV11();const m=ENCOUNTER_META_11[id]||{cat:'daily'};let w=6+(state.encounterPressure[m.cat]||0);w+=encounterWeight(id)*.45;if(m.major){w*=.32;if(state.day>=4)w*=1.8}if(m.cat==='strange')w+=state.mainThreads.under*.12+(state.chaosResonance||0)*.15;if(m.cat==='history')w+=skill('history')*.7+Math.max(0,lang('eastcommon')-3)*.6;if(m.cat==='social')w+=state.city.panic*.12+state.world.rumorHeat*.1;if(m.cat==='local')w+=(100-state.world.roadSafety)*.1+state.city.infection*.08;return Math.max(.5,w)}
weightedPick=function(ids){let total=ids.reduce((a,id)=>a+encounterWeight11(id),0),r=rng()*total;for(const id of ids){r-=encounterWeight11(id);if(r<=0)return id}return ids[ids.length-1]};
function ignoreEncounter11(id,amount=2){ensureV11();const cat=encounterCategory11(id);state.ignoredEncounters[id]=(state.ignoredEncounters[id]||0)+1;state.encounterPressure[cat]=clamp((state.encounterPressure[cat]||0)+amount,0,100);if(cat==='social')state.city.panic=clamp(state.city.panic+1,0,100);if(cat==='local')state.world.roadSafety=clamp(state.world.roadSafety-1,0,100);if(cat==='strange')modChaos(1,'이상 현상을 확인하지 않은 채 지나쳤다')}
for(const id of ['enc_jiangshi_scarecrow','enc_golem_tax','enc_resonance_debt','enc_mithril_knock'])if(!ENCOUNTER_POOL.includes(id))ENCOUNTER_POOL.push(id);

Object.assign(scenes,{
 enc_jiangshi_scarecrow:{title:'밭을 지키는 시체',location:'남쪽 개간촌 외곽',onEnter:s=>{advance(0,10);bumpThread('society',2)},text:s=>`${encounterBadge11('enc_jiangshi_scarecrow')}밭 한가운데 허수아비가 서 있다. 가까이 가면 천 아래 손가락 관절이 사람처럼 굽어 있다.\n\n농부는 죽은 사람을 세워둔 것이 아니라며 화를 낸다. “동부식 관절 인형”을 돈 주고 샀다고 한다. 그런데 부적의 먹선은 ${state.originKey==='human_east_jiangshi'?'당신 집안에서 쓰던 오래된 강시 제어식과 너무 닮았다.':'단순한 장식이라고 보기엔 지나치게 규칙적이다.'}\n\n문제는 인형이 어젯밤 밭 끝까지 걸어갔다가 돌아왔다는 증언이다.`,choices:[choice('부적과 관절을 조사한다.',s=>s.random.returnTo,{do:s=>{const r=check({stat:'int',skill:'arcana',diff:62,label:'강시식 판별'});if(r.ok){knowFact('개간촌의 허수아비에는 동부 강시술 계통의 제어식이 쓰였다.');bumpThread('under',5);scheduleConsequence('enc_jiangshi_scarecrow_echo',2)}advance(0,20)},noEncounter:true}),choice('농부에게 밤에는 태워버리라고 한다.',s=>s.random.returnTo,{do:s=>{publicDeed({'factions.farmers':1},'움직이는 허수아비를 태우라고 경고했다','개간촌 농민들이');advance(0,10)},noEncounter:true}),choice('남의 밭일이다. 지나간다.',s=>s.random.returnTo,{do:s=>ignoreEncounter11('enc_jiangshi_scarecrow',6),noEncounter:true})]},
 enc_jiangshi_scarecrow_echo:{title:'허수아비가 있던 자리',location:'남쪽 개간촌',text:s=>`이틀 뒤, 허수아비가 있던 자리에는 말뚝만 남아 있다. 태운 흔적은 없다. 밭 가장자리에서 도시 쪽으로 향한 맨발 같은 자국이 시작된다.\n\n강시술의 오래된 기술이 단순한 골동품으로 서부까지 흘러온 것인지, 누군가 목적을 갖고 옮긴 것인지는 아직 모른다.`,choices:[choice('흔적을 기록하고 다음 일을 따른다.',s=>s.random.returnTo||'day1_hub',{do:s=>{knowSuspicion('서부에 유입된 강시술 제어물이 스스로 이동했을 가능성이 있다.');bumpThread('under',7)},noEncounter:true})]},
 enc_golem_tax:{title:'골렘도 통행세를 내야 하는가',location:'남문 검문대',onEnter:s=>advance(0,8),text:s=>`${encounterBadge11('enc_golem_tax')}짐을 끄는 소형 골렘 하나가 남문 앞에 멈췄다. 주인은 장인 길드의 운송 골렘이라며 물건에만 세금을 내면 된다고 주장한다. 경비병은 “스스로 걷는 건 짐승이든 사람이든 통행 인원”이라고 우긴다.\n\n사소해 보이는 말다툼 뒤에는 더 큰 질문이 있다. 골렘이 도구인지, 노동자인지, 누군가의 재산인지. 인간력 30년의 법은 아직 그 질문을 준비하지 못했다.`,choices:[choice('물건이 아니라 운송수단으로 기록하자고 중재한다.',s=>s.random.returnTo,{do:s=>{const r=check({stat:'wis',skill:'persuasion',diff:57,label:'새 규칙 중재'});if(r.ok){modRep('factions','craftsmen',3,'골렘 통행 분쟁을 현실적으로 중재했다');bumpThread('society',3)}advance(0,15)},noEncounter:true}),choice('법에 없으면 일단 사람과 같은 세금을 내게 한다.',s=>s.random.returnTo,{do:s=>{modRep('factions','guard',2,'골렘 통행에 기존 검문 규칙을 적용했다');bumpThread('society',4);advance(0,10)},noEncounter:true}),choice('흥미롭지만 내 일이 아니다.',s=>s.random.returnTo,{do:s=>ignoreEncounter11('enc_golem_tax',4),noEncounter:true})]},
 enc_resonance_debt:{title:'공명으로 갚는 빚',location:'뒷골목 임시 제단',onEnter:s=>advance(0,8),text:s=>`${encounterBadge11('enc_resonance_debt')}골목 끝 작은 제단 앞에서 남자가 손바닥을 돌 위에 대고 있다. 채권자는 돈 대신 “오늘 한 번의 불 공명”을 빚으로 받겠다고 한다.\n\n공명이 신앙과 같지 않다는 걸 아는 사람에게도 이상한 거래다. 몸과 정신에 남는 힘을 화폐처럼 계약하는 관습은 이 도시의 정식 법에도, 교단 규정에도 없다.\n\n${chaosWhisper()}`,choices:[choice('계약 문구를 확인한다.',s=>s.random.returnTo,{do:s=>{gainSkill('arcana',1);knowSuspicion('일부 뒷골목에서 공명 사용 자체를 채무 상환 수단으로 거래한다.');bumpThread('society',4);advance(0,15)},noEncounter:true}),choice('아델이나 경비대에 알린다.',s=>s.random.returnTo,{do:s=>{modRep('factions','church',2,'불법 공명 채무 거래를 알렸다');bumpThread('society',5);advance(0,10)},noEncounter:true}),choice('계약 당사자들 일이다.',s=>s.random.returnTo,{do:s=>ignoreEncounter11('enc_resonance_debt',6),noEncounter:true})]},
 enc_mithril_knock:{title:'문이 없는 곳의 노크',location:'오래된 배수로 옆',onEnter:s=>{advance(0,6);modRes({spirit:-3})},text:s=>`${encounterBadge11('enc_mithril_knock')}벽 너머에서 세 번 두드리는 소리가 난다. 일정한 간격. 잠시 뒤 두 번. 다시 세 번.\n\n배수로 지도상 이 벽 뒤에는 공간이 없다. 그런데 드워프식 금속 감각이나 높은 역사 지식이 있다면, 아주 먼 중앙에서 전해진 <b>미스릴 도어</b> 이야기의 박자와 비슷하다는 생각이 스친다.\n\n문제는 중앙대륙이 여기서 너무 멀다는 점이다.`,choices:[choice('같은 박자로 벽을 두드려본다.',s=>s.random.returnTo,{do:s=>{const r=check({stat:'wis',skill:'arcana',diff:68,label:'응답 공명'});if(r.ok){modChaos(4,'공간이 없는 벽 너머에서 응답이 돌아왔다');knowSuspicion('미스릴 도어와 유사한 공명 패턴이 변경도시 지하에서도 나타난다.');bumpThread('under',10)}advance(0,10)},noEncounter:true}),choice('위치만 기록하고 물러난다.',s=>s.random.returnTo,{do:s=>{knowSuspicion('지도상 공간이 없는 배수로 벽 너머에서 규칙적인 노크가 들렸다.');bumpThread('under',4)},noEncounter:true}),choice('배수관 소리로 치고 지나간다.',s=>s.random.returnTo,{do:s=>ignoreEncounter11('enc_mithril_knock',8),noEncounter:true})]}
});

// 랜덤 사건 제목에 계층을 표시한다. 기존 장면 본문은 그대로 보존한다.
const render11base=render;
render=function(){ensureV11();render11base();renderV11Hud();const sc=state&&scenes[state.scene];if(state?.scene?.startsWith('enc_')&&sc){const text=document.getElementById('sceneText');if(text&&!text.querySelector('.encBadge'))text.insertAdjacentHTML('afterbegin',encounterBadge11(state.scene)+'<br>')}};

// 1.1 기록 탭: 삶의 연표와 메인 실마리를 같은 층위에서 확인한다.
const renderSheet11base=renderSheet;
renderSheet=function(tab){ensureV11();renderSheet11base(tab);const c=document.getElementById('sheetContent');if(!c)return;if(tab==='journal'){const th=activeThreads11();c.insertAdjacentHTML('afterbegin',`<div class="box" style="margin-bottom:12px"><h3>현재 메인 실마리</h3>${th.length?th.map(([k,v])=>`<div class="skillRow"><span>${threadLabel11(k)}</span><b>${v}</b></div>`).join(''):'<span class="dim">아직 어느 사건도 중심이 되지 않았습니다.</span>'}<p class="dim" style="font-size:11px;line-height:1.6">수치는 진행률이라기보다 이 삶이 해당 문제와 얼마나 깊게 얽혔는지를 나타냅니다. 라엔을 만나지 않아도 옛길과 지하의 문제는 진행될 수 있습니다.</p></div>`)}if(tab==='status'){c.insertAdjacentHTML('beforeend',`<div class="box" style="margin-top:12px"><h3>이번 삶의 출발</h3><div class="meta"><span>떠난 이유</span><b>${state.departure.reason||'아직 정해지지 않음'}</b><span>첫 경로</span><b>${state.departure.route||'아직 이동 전'}</b><span>변경도시 도착</span><b>${state.departure.arrived?'도착함':'아직'}</b></div></div>`)}};

// 1.1 저장 마이그레이션
const migrateV11base=migrateState;
migrateState=function(){migrateV11base();ensureV11();state.version='1.1.0'};
const freshV11base=freshState;
freshState=function(){const st=freshV11base();ensureV11();return st};

state=freshState();render();
</script>
</body>
</html>
