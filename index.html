<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>인간력 30년 : 뿌리 아래의 밤</title>
<meta name="theme-color" content="#11110f" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="인간력 30년: 뿌리 아래의 밤 - 선택과 기억, 관계와 평판이 이어지는 판타지 텍스트 RPG" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="인간력 30년" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="./css/game.css" />
</head>
<body>
<div class="wrap">
  <h1 class="title">인간력 30년</h1>
  <div class="sub">뿌리 아래의 밤 / LIFE PATH UPDATE 1.1</div>
  <div class="topbar">
    <button onclick="openSheet('status')">상태</button><button onclick="openSheet('skills')">능력/스킬</button><button onclick="openSheet('resonance')">공명</button><button onclick="openSheet('relations')">관계</button><button onclick="openSheet('reputation')">평판</button><button onclick="openSheet('journal')">기록</button><button onclick="saveGame()">저장</button><button onclick="loadGame()">불러오기</button>
  </div>
  <div id="recordStrip" class="recordStrip"></div>
  <div id="v11hud" class="v11hud"></div>
  <section class="panel">
    <h2 id="sceneTitle"></h2><div id="sceneMeta" class="sceneMeta"></div>
    <div id="sceneText" class="sceneText"></div>
    <div id="system" class="system"></div>
    <div id="review" class="reviewBox"></div>
    <div id="combat"></div>
    <div id="choices" class="choices"></div>
    <div class="footer"><button onclick="saveGame()">저장</button><button onclick="restartConfirm()">처음부터</button></div>
  </section>
  <section class="panel logPanel"><h2>최근 기록</h2><div id="log" class="log"></div></section>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheetHead"><h2 id="sheetTitle">상태</h2><button class="close" onclick="closeSheet()">닫기</button></div><div class="tabs"><button data-tab="status" onclick="switchSheet('status')">상태</button><button data-tab="skills" onclick="switchSheet('skills')">능력/스킬</button><button data-tab="resonance" onclick="switchSheet('resonance')">공명</button><button data-tab="relations" onclick="switchSheet('relations')">관계</button><button data-tab="reputation" onclick="switchSheet('reputation')">평판</button><button data-tab="journal" onclick="switchSheet('journal')">기록</button></div><div id="sheetContent"></div></div></div>
<!-- Ordered classic scripts: data, shared functions, registration, runtime layers, bootstrap. -->
<script src="./data/config.js"></script>
<script src="./data/origins.js"></script>
<script src="./data/npcs.js"></script>
<script src="./data/reputation.js"></script>
<script src="./data/encounters.js"></script>
<script src="./data/creation.js"></script>
<script src="./story/dialogue.js"></script>
<script src="./story/world.js"></script>
<script src="./js/runtime-state.js"></script>
<script src="./js/social.js"></script>
<script src="./js/state-rules.js"></script>
<script src="./js/dialogue.js"></script>
<script src="./js/navigation.js"></script>
<script src="./js/ui-persistence.js"></script>
<script src="./js/combat.js"></script>
<script src="./js/creation.js"></script>
<script src="./js/life-systems.js"></script>
<script src="./data/extensions.js"></script>
<script src="./story/scenes-base.js"></script>
<script src="./story/scenes-city.js"></script>
<script src="./story/scenes-life.js"></script>
<script src="./story/scenes-east.js"></script>
<script src="./story/scenes-v11.js"></script>
<script src="./js/runtime-layers.js"></script>
<script src="./js/bootstrap.js"></script>
</body>
</html>
